# Render Blueprint for the free-tier web service. See README.md for the
# cold-start behaviour this implies (Render spins down after 15 min idle,
# Neon autosuspends after 5) and the create_all/no-migrations decision.
services:
  - type: web
    name: splitwise-clone
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --host 0.0.0.0 and $PORT (Render-injected, not a hardcoded 8000) are
    # both required or the deploy's health check silently fails.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Pin the interpreter to match local dev (Python 3.13).
      - key: PYTHON_VERSION
        value: "3.13.14"
      # Neon pooled connection string (hostname contains "-pooler"). Set in
      # the Render dashboard after creating the Neon branch — never a
      # literal value here.
      - key: DATABASE_URL
        sync: false
      # Generated and persisted by Render; never committed.
      - key: SECRET_KEY
        generateValue: true
      # config.py defaults this to false so local http://127.0.0.1 dev
      # works; production must override to true or the session cookie
      # ships without the Secure flag.
      - key: SESSION_HTTPS_ONLY
        value: "true"
