{% extends "base.html" %}
{% block title %}Splitwise Clone{% endblock %}
{% block content %}
  <h1>Splitwise Clone</h1>
  <p>Split expenses with a friend group — no accounts, just a link.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="/groups">
    <label for="name">Group name</label>
    <input type="text" id="name" name="name" required maxlength="80" autofocus>
    <div class="submit-bar">
      <button type="submit">Create group</button>
    </div>
  </form>
{% endblock %}
