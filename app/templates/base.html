<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Splitwise Clone{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- Hidden by default (the `hidden` attribute -> display:none via the UA
       stylesheet), so with JS disabled this never appears — the page just
       loads normally. app.js only un-hides it if a navigation is still
       pending ~2s after it started, which a fast/warm response never is. -->
  <div id="loading-indicator" class="loading-indicator" role="status" aria-live="polite" hidden>
    Waking up &mdash; this can take a minute on the free tier.
  </div>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
