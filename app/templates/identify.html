{% extends "base.html" %}
{% block title %}Who are you? — {{ group.name }}{% endblock %}
{% block content %}
  <h1>{{ group.name }}</h1>
  <p>Who are you?</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="/g/{{ group.slug }}/identify">
    {% if members %}
      <label for="existing_member_id">I'm already on the list</label>
      <select id="existing_member_id" name="existing_member_id">
        <option value="">— pick your name —</option>
        {% for m in members %}
          <option value="{{ m.id }}">{{ m.name }}{% if m.password_hash %} (has a password){% endif %}</option>
        {% endfor %}
      </select>
    {% endif %}

    <label for="new_name">Or I'm new — my name is</label>
    <input type="text" id="new_name" name="new_name" maxlength="80">

    <label for="password">Password (only if you picked a name with one, or want to set one)</label>
    <input type="password" id="password" name="password" maxlength="200">

    <button type="submit">Continue</button>
  </form>
{% endblock %}
