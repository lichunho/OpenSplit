services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Read from the host shell if set; otherwise fall back to local
      # defaults. No secret is baked into the image itself — these are
      # runtime env vars, not Dockerfile ENV/ARG.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./app.db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
